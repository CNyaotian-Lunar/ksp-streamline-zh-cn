        #LOC_StreamlineNESD_description_Int1 = 这款流线型圆形进气口的设计目标，是把气流高效地径直送进发动机，同时把阻力和湍流压到最低，因此非常适合高速大气层飞行。它干净、圆润的轮廓能在很宽的速度范围内维持气流平顺，提升发动机表现，并在你逼近极限时减少熄火的可能性。它在设计上兼顾效率和耐用，能整齐地接进机身结构，为喷气发动机和混合发动机都提供可靠进气。不管你在造一架线条流畅的空天飞机，还是一架高性能飞机，这款进气口都能让空气流到最关键的地方——进发动机，而不是绕着它走。
        #LOC_StreamlineNESD_description_Int2 = DTE Streamline 圆形进气口的放大版，设计目标是把气流高效地直接送进发动机，同时把阻力和湍流压到最低，因此非常适合高速大气层飞行。它干净圆润的轮廓有助于在各种速度区间维持顺畅气流，提升发动机表现，并降低极限状态下的熄火概率。兼顾效率与耐用性，它能整齐地融入机身设计，为喷气发动机和混合动力发动机提供可靠的进气。不管你是在造一架流线型空天飞机还是一架高性能飞机，这款进气口都能把空气送到最该去的地方——送进发动机，而不是绕开它。
        #LOC_StreamlineNESD_description_Int3 = 这款流线型内嵌式进气口设计上能干净地嵌进机身，以极低阻力、极高效率把气流直接导入发动机。它顺滑连续的轮廓让气流沿机体保持层流，非常适合每一分气动性能都要抠的高速设计。它能在很宽的速度区间内提供稳定一致的气流，让发动机平顺运转，并降低苛刻工况下的熄火风险。无论流线型空天飞机还是高性能飞机都合用：它无缝集成，确保发动机在对的位置拿到它需要的空气。
        #LOC_StreamlineNESD_description_mk1adapterS1 = 这些流线型整流段设计成紧贴发动机前方安装，理顺气流，让身后的东西稍微不那么……着火。它们把空气干净地引到暴露的发动机部件周围，有助于降低阻力、提升高速下的稳定性，还能让你的飞行器拥有工程师最爱的那种流线外观——一看就“绝对是故意这么设计的”。采用轻质而耐用的材料制成，能承受发动机附近的严酷条件，同时保护敏感零件免受高温与湍流。无论你是要硬穿稠密大气，还是只想让空天飞机看起来不像一堆零件拼出来的，这些整流段都能保证发动机得到它需要的气流——而不带上通常那堆混乱。这一款带一个侧节点
        #LOC_StreamlineNESD_description_mk1adapterS2 = 这些流线型整流段设计用来贴在发动机正前方，理顺气流，并让它们后面的东西不那么……着了火。通过把干净气流引到裸露的发动机部件周围，它们有助于降低阻力、提升高速下的稳定性，还能让你的飞行器拥有工程师们钟爱的那种利落、“绝对是刻意设计过的”外观。由轻质而耐用的材料制成，它们能承受靠近工作发动机的严苛环境，同时保护敏感部件免受高温与乱流影响。不管你是要穿透稠密大气，还是只想让空天飞机看着不那么像一堆备件拼的，这些整流段都能保证发动机获得它需要的气流——而没有随之而来的那堆混乱。  这个版本带两个侧挂节点，共三种变体
        #LOC_StreamlineNESD_description_mk1adapterS3 = 这些流线型整流段专为装在发动机正前方而设计，能理顺气流，让后面的东西没那么……着火。它们把气流干净地导向外露的发动机部件周围，有助于降低阻力、提升高速稳定性，还能让你的飞船拥有工程师最爱的利落外观——「一看就是故意设计成这样的」。它们由轻质耐用材料制成，能承受发动机附近的极端环境，同时保护敏感部件免受高温和湍流侵扰。无论你是在厚大气里硬推，还是只想让空天飞机别看起来像一堆备件拼的，这些整流段都能确保发动机获得所需气流——而不带来通常伴随而来的那堆混乱。这个版本带三个侧面节点，共四种变体。
