        #LOC_StreamlineNESD_description_mk2Duet = 这款紧凑的发射级把一个小型内置燃料箱和两台发动机合为一体，用高度紧凑的形态在离开发射台那一刻就提供可靠推力。它为一子级的高效表现而设计：成对的发动机推力均衡、控制更好，同时整体占地极小。适合轻型运载器、助推级或模块化堆叠；它把推进与燃料打包成一个即插即用的整体，简化了级间分离——毕竟有时候，离开地面最好的办法就是发动机翻倍、麻烦减半。
        #LOC_StreamlineNESD_description_mk2Trio = 这个紧凑的起飞级把小号内置燃料罐和三台发动机合成一体，用极小的体积在离开发射台的一刻就给出强劲可靠的推力。三机并联专为一子级的高效表现设计，推力出色、控制也均衡，整体占地却很小。它适合轻量运载火箭、助推器和模块化堆叠，把动力和燃料打包成一个即插即用的整件，省掉了分级上的麻烦——毕竟有时候离开地面的最好办法，就是把发动机数量乘以三，别的什么都不用管。
