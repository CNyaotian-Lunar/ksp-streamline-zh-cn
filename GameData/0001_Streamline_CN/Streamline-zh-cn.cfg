        #LOC_StreamlineNESD_description_wingtubeCap = 这款流线型端盖能整齐地封住带内部通行管的机翼段开口，在保持气密加压的同时维持干净的气动外形。它与机翼结构无缝整合，避免不必要的气流扰动，让乘员通道妥善封闭。不管是收尾翼尖还是封住一段通道，这个端盖都能让设计既高效又气密——毕竟就算是 Kerbal，也不喜欢走廊里灌风。
        #LOC_StreamlineNESD_description_wingtubeDec = 这个内置分离器专为翼内乘员输送管设计，能让飞船各段干净分离，而不破坏内部通道系统。它能在分级前一直维持对齐和结构完整，确保在抛弃重量或执行大胆逃逸机动时干净断开。无论你是在分离机翼段还是为设计增加模块化灵活性，这个分离器都会把东西连在一起——直到它非常刻意地不再连。
        #LOC_StreamlineNESD_description_wingtubeDock = 这个专用端盖能封住机翼内乘员通道的末端，同时集成一个功能完整的对接端口，让你的内部通道无缝延伸到对接上的飞船里。它的设计兼顾保压与结构完整性，在提供干净气动收尾的同时，让乘员无需 EVA 即可转移——前提是对接按计划成功。对模块化空天飞机和雄心勃勃的轨道组装体来说再合适不过；它把一个简单的端点变成了门，因为有时候最好的前进方式，就是从另一艘船里穿过去。
        #LOC_StreamlineNESD_description_wingtubeFairing = 这款流线型翼根整流罩用于把机翼内乘员通道平滑地并入主机身，在降低阻力的同时保护内部通道结构。它的贴合外形确保在关键的翼身结合部形成干净气流，提升高速飞行时的稳定性和整体气动效率。它按承受结构载荷、维持保压连续性来打造，在飞船核心与延伸出去的机翼网络之间提供牢固气密的连接。对进阶空天飞机和模块化设计来说很理想——它让一切顺畅流动，不管是机翼外面还是里面。
