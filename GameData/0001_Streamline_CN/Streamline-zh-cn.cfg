        #LOC_StreamlineNESD_description_mk1cone1 = 这款流线型机头锥拥有干净的前指轮廓，能在高速下平顺切开大气、降低阻力并提升整体稳定性。它的正前朝向提供了均衡的气动外形，易于与机身和进气系统整合，帮助保持机上气流稳定。它能承受上升段和高速飞行的应力，在保护内部部件的同时成就流线高效的设计。无论你是在打磨空天飞机还是优化高性能飞机，这款机头锥都能让一切保持正确方向——字面意义上和气动意义上都是。
        #LOC_StreamlineNESD_description_mk1cone2 = 这款流线型头锥的轮廓带一点微妙的偏置，尖端偏离中轴约 10 度，用来微调气流、顺便给它添上一点独特的空气动力学个性。这点小倾角有助于引导气流，也能配合特殊布局，同时还能保持低阻力和高速下的稳定表现。它设计成能顺畅地接到机身和进气系统上，既保护内部部件，又让整机看起来干净利落、有目的性。不管你是在试验非常规设计，还是在调校一套独特的空天飞机方案，这款头锥都证明了一件事：有时候一个小小的角度，差别就是很大。
