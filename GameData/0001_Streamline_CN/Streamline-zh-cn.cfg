        #LOC_StreamlineNESD_description_wingtubeL = 工程师们坚持认为机翼需要“更多功能”，所以每个翼段不再把空间白白浪费在结构上，而是在核心位置塞进了一根加压通行管，让 Kerbal 不用出舱就能从飞船这头走到那头——飞行中修东西、跑去拿零食，或者紧急时刻来一段英勇的戏剧性漫步，都再合适不过。上下表面都装了加强观察窗，抬头能看到天上风景，低头能看到脚下飞掠而过的大地，景色惊艳（偶尔也让人心里发毛），于是每次穿过这条通道都变成一场不由自主的观光游。管子是……有点挤……但完全加压，额定适用绝大多数常规操作，因此非常适合连接乘员舱、货舱，或者那个大家都保证绝对安全的实验模块。这也再次证明：机翼能做的、而且大概也该做的，远不止让你飞在天上。
